services:
 api:
  container_name: docker-commerce-api

  build:
    context: .
    dockerfile: Dockerfile

  env_file:
    - .env

  ports:
    - "${PORT}:3000"

  restart: unless-stopped

  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 10s

  depends_on:
    postgres:
      condition: service_healthy

    redis:
      condition: service_healthy

  postgres:
    container_name: docker-commerce-db

    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: docker-commerce-redis

    image: redis:7-alpine

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: