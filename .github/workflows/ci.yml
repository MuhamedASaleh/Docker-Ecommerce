name: CI      // name of the workflow

on:       // work when i push on origin main or when i create a pull request on origin main
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:    // name of the job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci