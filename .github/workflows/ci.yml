name: CI     

on:       
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:   
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build Docker image
        run: docker build -t docker-commerce-api . 

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag Docker image
        run: docker tag docker-commerce-api:latest ${{ secrets.DOCKERHUB_USERNAME }}/docker-commerce-api:latest
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/docker-commerce-api:latest



